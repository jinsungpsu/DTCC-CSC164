<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>DTCC, CSC164</title>

    <link rel="stylesheet" href="styles/home.css">
</head>

<body>

    <div class="container">

        <div class="hero">
            <h1>CSC164</h1>
            <p>Computer Science II</p>
        </div>

        <div id="modules-container">
            <!-- dynamically generated -->
        </div>

        <div class="footer">
            Delaware Technical Community College • CSC164
        </div>

    </div>

    <script>

        async function loadManifest() {

            try {

                const response = await fetch("manifest.json");

                if (!response.ok) {
                    throw new Error("Could not load manifest.json");
                }

                const manifest = await response.json();

                renderModules(manifest.modules);

            }
            catch (error) {

                document.getElementById("modules-container").innerHTML = `
                    <div class="module-card">
                        <h2>Error</h2>
                        <p>Unable to load lecture catalog.</p>
                    </div>
                `;

                console.error(error);
            }
        }

        function renderModules(modules) {

            const container =
                document.getElementById("modules-container");

            container.innerHTML = "";

            modules.forEach((module, index) => {

                const moduleCard =
                    document.createElement("div");

                moduleCard.className =
                    "module-card";

                const moduleTitle =
                    document.createElement("h2");

                moduleTitle.textContent =
                    `Module ${index + 1}: ${module.title}`;

                moduleCard.appendChild(moduleTitle);

                module.lectures.forEach(lecture => {

                    const lectureLink =
                        document.createElement("a");

                    lectureLink.className =
                        "lecture-link";

                    lectureLink.href =
                        `./slide.html?deck=${module.folder}/${lecture.file}`;

                    lectureLink.innerHTML = `
                        <div class="lecture-title">
                            ${lecture.title}
                        </div>
                        <div class="lecture-desc">
                            Lecture Slides
                        </div>
                    `;

                    moduleCard.appendChild(lectureLink);

                });

                container.appendChild(moduleCard);

            });

        }

        loadManifest();

    </script>

</body>

</html>
