<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Lectures</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .spinner {
            font-size: 48px;
            display: block;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="spinner">📚</span>
        <h1>Loading Lectures...</h1>
        <p>Redirecting to the lecture framework...</p>
    </div>

    <script>
        (function() {
            // ============================================================
            // FULLY AUTOMATIC - No hardcoded URLs!
            // ============================================================
            
            // Get the current course URL dynamically
            const COURSE_URL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            
            // Detect the framework location automatically
            // If we're in a course repo, the framework is likely at:
            // ../DTCC-Lectures-RevealJS-Framework/ (relative path)
            // OR at a known GitHub Pages URL
            function getFrameworkBase() {
                // Try relative path first (for local development)
                const relativePath = '../DTCC-Lectures-RevealJS-Framework/';
                
                // Check if we can access the framework locally
                // We'll try a HEAD request to detect
                const testUrl = relativePath + 'index.html';
                
                // For production, we can detect from the domain
                const hostname = window.location.hostname;
                if (hostname.includes('github.io')) {
                    // If we're on GitHub Pages, use the known framework URL
                    const pathParts = window.location.pathname.split('/');
                    // If we're in a course repo like /DTCC-CSC164/
                    if (pathParts.length > 1 && pathParts[1].startsWith('DTCC-')) {
                        return 'https://jinsungpsu.github.io/DTCC-Lectures-RevealJS-Framework/';
                    }
                }
                
                // Default to relative path (works locally)
                return relativePath;
            }
            
            const FRAMEWORK_BASE = getFrameworkBase();
            
            // Build the redirect URL
            const frameworkUrl = new URL(FRAMEWORK_BASE + 'index.html', window.location.href);
            frameworkUrl.searchParams.set('course', COURSE_URL);
            
            console.log('📚 Course URL:', COURSE_URL);
            console.log('🚀 Framework URL:', frameworkUrl.toString());
            
            // Redirect
            setTimeout(() => {
                window.location.href = frameworkUrl.toString();
            }, 800);
        })();
    </script>
</body>
</html>
